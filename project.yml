name: Eng

options:
  bundleIdPrefix: dev.jvroth
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 585XAFGPDN
    CODE_SIGN_STYLE: Automatic

# EngCore is consumed as the local SwiftPM product so the app and the Mac bridge
# compile exactly the same module instead of the app re-compiling its sources.
packages:
  ios-eng:
    path: .

targets:
  Eng:
    type: application
    platform: iOS
    sources:
      - path: EngApp
        excludes:
          - Info.plist
    dependencies:
      - package: ios-eng
        product: EngCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jvroth.eng
        PRODUCT_NAME: Eng
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: "7"
        MARKETING_VERSION: "0.5.1"
        SUPPORTS_MACCATALYST: NO
    info:
      path: EngApp/Info.plist
      properties:
        CFBundleDisplayName: Eng
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSLocalNetworkUsageDescription: Eng connects privately to the Codex bridge running on your Mac.
        NSBonjourServices:
          - _ios-eng._tcp
          - _ios-eng-fast._tcp
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait

  EngTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EngAppTests
    dependencies:
      - target: Eng
      - package: ios-eng
        product: EngCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jvroth.eng.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Eng:
    build:
      targets:
        Eng: all
        EngTests: [test]
    test:
      targets:
        - EngTests
      gatherCoverageData: true
